<div>
  <div class="horizontal-field" style="width: 60%;">
    <div class="label">Rango de Fechas</div>
    <div class="Control">
      <dx-date-range-box [startDate]="fechaDesde!" displayFormat="'MMMM/yyyy" [endDate]="fechaHasta!"
        (onValueChanged)="currentValueChanged($event)">
        <dx-date-range-box-picker>
          <dx-date-box type="date" displayFormat="MMMM yyyy" pickerType="calendar">
            <dx-calendar [zoomLevel]="'year'" [minZoomLevel]="'year'" [maxZoomLevel]="'decade'">
            </dx-calendar>
          </dx-date-box>
        </dx-date-range-box-picker>
      </dx-date-range-box>
    </div>
  </div>
  <div class="grid-container">
    <dx-pivot-grid id="pivotgrid" [dataSource]="pivotGridDataSource" [showBorders]="true" [allowSortingBySummary]="true"
      [allowFiltering]="false" [showRowGrandTotals]="true" [showColumnGrandTotals]="false" [showRowTotals]="false"
      [showColumnTotals]="false" [fieldPanel]="{ visible: false }" [allowExpandAll]="true" [showToolbar]="true"
      (onToolbarPreparing)="onToolbarPreparing($event)" [height]="'100%'">
      <dxo-export [enabled]="true"></dxo-export>
      <dxo-field-chooser [enabled]="true" [height]="400"></dxo-field-chooser>
      <dxo-scrolling mode="virtual"></dxo-scrolling>
    </dx-pivot-grid>
  </div>
</div>
