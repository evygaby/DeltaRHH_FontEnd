<h5 class="mb-0">Comparación de Roles</h5>
<div>
  <div class="Cab">
    <div class="horizontal-field" style="width: 50%;">
      <div class="label">Rango de Fechas</div>
      <div class="Control">
        <dx-date-range-box [startDate]="fechaDesde ?? null" [endDate]="fechaHasta ?? null" displayFormat="MMMM yyyy"
          [showClearButton]="true" (onValueChanged)="currentValueChanged($event)">

          <dx-date-range-box-picker>
            <dx-date-box type="date" pickerType="calendar" displayFormat="MMMM yyyy" [calendarOptions]="{
        zoomLevel: 'year',
        maxZoomLevel: 'year',
        minZoomLevel: 'decade'
      }">
            </dx-date-box>
          </dx-date-range-box-picker>
        </dx-date-range-box>
      </div>
    </div>
    <div class="toolbar-buttons" style="width: 50%;">
      <dx-button icon="exportxlsx" type="export" text="Exportar Xlsx" (onClick)="exportToExcel()">
      </dx-button>
      <dx-button icon="plus" type="expand" text="Expandir todo" (onClick)="expandAll()">
      </dx-button>
      <dx-button icon="minus" type="collapse" text="Colapsar todo" (onClick)="collapseAll()">
      </dx-button>
    </div>
  </div>
  <div class="grid-container">
    <dx-pivot-grid #pivotgrid [dataSource]="pivotGridDataSource" [showBorders]="true" [allowSortingBySummary]="true"
      [allowFiltering]="false" [showRowGrandTotals]="true" [showColumnGrandTotals]="false" [showRowTotals]="false"
      [showColumnTotals]="false" [showToolbar]="true" [fieldPanel]="{ visible: false }" [allowExpandAll]="true"
      [height]="'100%'">
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      <dxo-field-chooser [applyChangesMode]="'onDemand'" [allowSearch]="true" [enabled]="true">
      </dxo-field-chooser>
    </dx-pivot-grid>
  </div>
</div>
